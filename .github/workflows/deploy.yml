name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without pushing.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Pages must already be enabled on the repository with its source set to
      # GitHub Actions. The workflow token can deploy to an existing Pages
      # site but is not allowed to create one, so `enablement: true` fails
      # with "Resource not accessible by integration". Enable it once under
      # Settings, Pages, or with:
      #   gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      # A repository named <user>.github.io is served from the domain root and
      # base_path is empty. Any other repository is served from /<repo>, and
      # every asset URL has to carry that prefix.
      - name: Build
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build

      # Without this, Pages runs the output through Jekyll, which drops every
      # directory beginning with an underscore, including _next.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
